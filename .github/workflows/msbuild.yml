name: MSBuild

concurrency:
  group: "${{ github.workflow }}:${{ github.event_name }}:${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

on:
  pull_request_target:
    branches: [ master ]
    types: [ opened, synchronize, reopened ]
  push:
    tags:
      - '*'
  merge_group:
    types: [ checks_requested ]
    
env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: ./src/EasyEPlanner.sln

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

jobs:
  # --------------------
  # Gatekeeper check
  # --------------------
  check:
    name: Check
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      result: ${{ steps.pass.outputs.result }}
    steps:
    - id: organization_membership
      run: >
        $response = (curl -L
        -w '%{http_code}'
        -H "Accept: application/vnd.github+json"
        -H "Authorization: Bearer ${{ secrets.EPLANNER_TOKEN }}"
        -H "X-GitHub-Api-Version: 2022-11-28"
        https://api.github.com/orgs/sav-oss-eplanner/members/${{ github.triggering_actor }})
        
        echo "response=$response" >> $env:GITHUB_OUTPUT
      continue-on-error: true

    - id: pass
      if: >-
        (github.event_name == 'pull_request_target' && steps.organization_membership.outputs.response == '204') ||
        github.actor == 'dependabot[bot]' ||
        github.event_name == 'merge_group' ||
        startsWith(github.ref, 'refs/tags/')
      run: echo "result=success" >> $env:GITHUB_OUTPUT
    
    - name: exit with failure
      if: steps.pass.outputs.result != 'success'
      run: exit 1

  # --------------------
  # Build and test
  # --------------------
  build:
    name: Build, analyze and test
    runs-on: windows-latest
    needs: check
    if: needs.check.outputs.result == 'success'
    outputs:
      artifact_url: ${{ steps.upload-artifact.outputs.artifact-url }}
    permissions:
      contents: read
      pull-requests: read

    steps:
    - name: Set Timezone
      shell: powershell
      run: Set-Timezone -Id 'Belarus Standard Time'

    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        allow-unsafe-pr-checkout: 'true'

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: 17
        distribution: 'zulu'

    - name: Cache SonarCloud packages
      uses: actions/cache@v6
      with:
        path: ~\sonar\cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache SonarCloud scanner
      id: cache-sonar-scanner
      uses: actions/cache@v6
      with:
        path: .\.sonar\scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner

    - name: Install SonarCloud scanner
      if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        New-Item -Path .\.sonar\scanner -ItemType Directory
        dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner

    - name: Install dotnet-coverage
      shell: powershell
      run: |
        dotnet tool install --global dotnet-coverage

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Download fetch.exe and EPLAN API binaries, copy it to the .net specific path
      run: |
        curl -L "https://github.com/gruntwork-io/fetch/releases/download/v0.4.2/fetch_windows_amd64.exe" -O
        md src/bin/${{env.BUILD_CONFIGURATION}}
        ./fetch_windows_amd64.exe --github-oauth-token="${{ secrets.EPLANNER_TOKEN }}" --repo="https://github.com/sav-oss-eplanner/EPLAN-API-bin" --tag="2.9" --release-asset=".*" "src/bin/${{env.BUILD_CONFIGURATION}}"
        md submodule/EplanIdleTimeModule/EplanIdleTimeModule/bin/${{env.BUILD_CONFIGURATION}}
        cp src/bin/${{env.BUILD_CONFIGURATION}}/* submodule/EplanIdleTimeModule/EplanIdleTimeModule/bin/${{env.BUILD_CONFIGURATION}}

    - name: Prepare PULL_REQUEST_DATA
      env:
        PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_SHA: ${{ github.event.pull_request.head.sha }}
      if: github.event_name == 'pull_request_target'
      run: echo "PULL_REQUEST_DATA=/d:sonar.pullrequest.key=$env:PR_NUMBER /d:sonar.pullrequest.branch=$env:PR_BRANCH /d:sonar.scm.revision=$env:PR_SHA" >> $env:GITHUB_ENV

    - name: Sonar scanner begin
      working-directory: ${{env.GITHUB_WORKSPACE}}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: .\.sonar\scanner\dotnet-sonarscanner begin /k:"sav-oss-eplanner_EasyEPLANner" /o:"sav-oss-eplanner" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.vscoveragexml.reportsPaths="EasyEplanner.Tests/coverage.xml" ${{ env.PULL_REQUEST_DATA }}
      
    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}

    - name: Test
      working-directory: EasyEplanner.Tests
      run: dotnet test --no-build --configuration ${{env.BUILD_CONFIGURATION}} --collect "Code Coverage"
      
    - name: Test coverage merge
      working-directory: EasyEplanner.Tests
      run: dotnet-coverage merge -o coverage.xml -f xml -r *.coverage

    - name: Sonar scanner end
      working-directory: ${{env.GITHUB_WORKSPACE}}
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

    - name: Delete extra files
      working-directory: src/bin/${{env.BUILD_CONFIGURATION}}
      run: | 
        del *.pdb 
        del Eplan.EplApi.*
        del EplanBaseNetu.dll
        del Microsoft.mshtml.dll

    - name: Upload artifact
      id: upload-artifact
      uses: actions/upload-artifact@v7
      with:
        name: EasyEPLANner
        path: src/bin/${{env.BUILD_CONFIGURATION}}
    

  # --------------------
  # Publish build on PR
  # --------------------
  publish-pr-build:
    name: Publish PR build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request_target' && needs.build.result == 'success'
    permissions:
      pull-requests: write

    steps:
    - name: Create or update PR build comment
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_SHA: ${{ github.event.pull_request.head.sha }}
        ARTIFACT_URL: ${{ needs.build.outputs.artifact_url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        $headers = @{
          Authorization = "Bearer $env:GITHUB_TOKEN"
          Accept = "application/vnd.github+json"
          'X-GitHub-Api-Version' = '2022-11-28'
        }
        $marker = '<!-- easy-eplanner-pr-build -->'
        $body = @"
        ## 📦 Сборка pull request #$env:PR_NUMBER

        - Коммит: $env:PR_SHA
        - Архив: [Скачать сборку]($env:ARTIFACT_URL)
        - [Запуск сборки]($env:RUN_URL)

        $marker
        "@
        $comments = @()
        $page = 1
        do {
          $pageComments = Invoke-RestMethod -Method Get `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/issues/$env:PR_NUMBER/comments?per_page=100&page=$page" `
            -Headers $headers
          $comments += $pageComments
          $page++
        } while ($pageComments.Count -eq 100)

        $existingComment = $comments |
          Where-Object { $_.user.login -eq 'github-actions[bot]' -and $_.body.Contains($marker) } |
          Select-Object -First 1
        $payload = @{ body = $body } | ConvertTo-Json
        if ($existingComment) {
          Invoke-RestMethod -Method Patch `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/issues/comments/$($existingComment.id)" `
            -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
        }
        else {
          Invoke-RestMethod -Method Post `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/issues/$env:PR_NUMBER/comments" `
            -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
        }

  # --------------------
  # Release on tags
  # --------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    name: Release
    runs-on: windows-latest
    needs: build
    permissions:
      contents: write

    steps:
    - name: Set Timezone
      shell: powershell
      run: Set-Timezone -Id 'Belarus Standard Time'

    - id: get-date
      run: echo "date=$(date +'%d.%m.%Y')" >> $env:GITHUB_OUTPUT

    - name: Download artifact
      uses: actions/download-artifact@v8
      with:
        name: EasyEPLANner
        path: ./bin

    - name: Get assembly version
      id: assembly-version
      shell: powershell
      working-directory: ./bin
      run: |
        $version=[System.Reflection.Assembly]::LoadFrom("./EPLAN.EplAddin.EasyEPlanner.dll").GetName().Version.ToString()
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - uses: actions/checkout@v7
      with:
        path: ./EasyEPLANner
        submodules: 'recursive'
        fetch-depth: 0

    - name: Generate ChangeLog
      id: change-log
      shell: powershell
      working-directory: ./EasyEPLANner
      run: |
        echo "changelog<<^D" >> $env:GITHUB_OUTPUT
        $logs = (git log --pretty=tformat:"%b" ((git tag --sort=committerdate | Select-Object -Last 2) -join "..")) -join "`n"
        foreach ($match in [Regex]::Matches($logs, '```ChangeLog\n?([\w\W]*?)\n?```')) {
          $change = ($match.Groups[1].Value -replace '\s+', ' ').Trim().TrimEnd(';,.')
          echo "- $change." >> $env:GITHUB_OUTPUT
        }
        echo ^D >> $env:GITHUB_OUTPUT

    - name: Pack
      shell: powershell
      working-directory: ./bin
      run: Compress-Archive -Path .\* -Update -DestinationPath EasyEPLANner.zip

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: ${{ github.ref_name }}
        body: |
          ## Информация о релизе

          - Дата сборки: ${{ steps.get-date.outputs.date }}
          - Версия надстройки: ${{ steps.assembly-version.outputs.version }}

          ## Список изменений

          ${{ steps.change-log.outputs.changelog }}
        files: |
          ./bin/EasyEPLANner.zip
        generate_release_notes: true
        draft: false
        prerelease: false
